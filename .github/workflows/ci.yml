name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Track 1: Quality Gates (Independent & Parallel) ───────────

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Backend & Tests
        run: bun run typecheck

      - name: Typecheck Frontend
        run: bun run typecheck:frontend

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome Lint & Format Check
        run: bun run lint

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Fallow Architectural Boundary & Dead Code Gates
        run: bun run check:fallow

  dependencies:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Knip Unused Dependencies & Exports Check
        run: bun run check:knip

  cycles:
    name: Circular Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dpdm Circular Dependency Analysis
        run: bun run check:cycles

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Test Suite with Coverage Ratchet
        run: bun run test:coverage

  # ── Track 2: Assembly & Operational Validation ────────────────

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Production Frontend Assets
        run: bun run build

  integration:
    name: Integration
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Server Lifecycle & API Integration Tests
        run: bun run test:integration

  frontend-smoke:
    name: Frontend Smoke
    needs: [build, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Client Shell & View Smoke Tests
        run: bun run test:frontend-smoke

  # ── Final Gate: Branch Protection Anchor ──────────────────────

  required-ci:
    name: Required CI
    if: always()
    needs:
      - typecheck
      - lint
      - architecture
      - dependencies
      - cycles
      - test
      - build
      - integration
      - frontend-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check all required CI gates
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Evaluated job results: $results"
          if echo "$results" | grep -E -q "failure|cancelled"; then
            echo "::error::One or more required CI gates failed or were cancelled."
            exit 1
          fi
          echo "All required CI quality gates and assembly stages completed successfully."
