name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck Frontend
        run: bun run typecheck:frontend

      - name: Lint
        run: bun run lint

      - name: Architecture & Dead Code Gates (Fallow)
        run: bunx fallow

      - name: Unused Code & Dependencies (Knip)
        run: bun run knip

      - name: Circular Dependency Check (dpdm)
        run: bun run check:cycles

      - name: Test
        run: bun test --coverage
